<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVideo — Free Video Generator</title>
<meta name="description" content="PVideo: script se free Shorts video banao. Hindi + English.">
<meta name="theme-color" content="#6a1bff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", sans-serif;
         background:#0d0d1a; color:#fff; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  header { text-align:center; margin:8px 0 20px; }
  header .logo { font-size:44px; font-weight:800;
    background:linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  header p { color:#b9b9d6; margin:6px 0 0; font-size:15px; }
  label { display:block; margin:14px 0 6px; font-weight:600; font-size:15px; }
  label small { color:#9a9ab8; font-weight:400; }
  textarea, input[type=text], select {
    width:100%; border-radius:12px; border:1px solid #2c2c4d;
    background:#17172b; color:#fff; padding:12px; font-size:16px; }
  textarea { min-height:150px; resize:vertical; line-height:1.5; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  #makeBtn {
    width:100%; margin-top:18px; padding:16px; font-size:20px; font-weight:800;
    border:0; border-radius:14px; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#db2777); }
  #makeBtn:disabled { opacity:.55; cursor:wait; }
  #status { margin-top:16px; text-align:center; font-size:15px; color:#c9c9e6;
    min-height:24px; }
  #dl { display:none; text-align:center; margin-top:14px; }
  #dl a {
    display:inline-block; padding:14px 28px; border-radius:12px; font-size:18px;
    font-weight:700; color:#0d0d1a; background:#4ade80; text-decoration:none; }
  .hint { margin-top:22px; font-size:13px; color:#8f8fb0; text-align:center; line-height:1.6; }
  .err { color:#ff8a8a; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #555;
    border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite;
    vertical-align:-3px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">PVideo</div>
    <p>Script likho → Video banao → Download karo<br><small>100% free • Hindi + English</small></p>
  </header>

  <label for="title">Title <small>(पहले scene पर दिखेगा • optional)</small></label>
  <input type="text" id="title" maxlength="80" placeholder="जैसे: मज़ेदार तथ्य">

  <div class="row">
    <div>
      <label for="lang">Voice / भाषा</label>
      <select id="lang">
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <label for="script">Script <small>(10–2000 characters • हर वाक्य एक scene)</small></label>
  <textarea id="script" placeholder="यहाँ अपनी script लिखो…&#10;जैसे: क्या आप जानते हैं? ऑक्टोपस के तीन दिल होते हैं।"></textarea>

  <button id="makeBtn" onclick="makeVideo()">🎬 Video Banao</button>
  <div id="status"></div>
  <div id="dl"><a id="dlLink" href="#">⬇ Download Video</a></div>

  <div class="hint">
    Ek video banne me 1–3 minute lag sakte hain.<br>
    Roz ke kaafi saare video free me banao — koi coin, koi paisa nahi।
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(function(){});
}
let timer = null;
function setStatus(html, isErr) {
  const el = document.getElementById('status');
  el.innerHTML = html;
  el.className = isErr ? 'err' : '';
}
async function makeVideo() {
  const text = document.getElementById('script').value.trim();
  const lang = document.getElementById('lang').value;
  const title = document.getElementById('title').value.trim();
  const btn = document.getElementById('makeBtn');
  document.getElementById('dl').style.display = 'none';
  if (text.length < 10) { setStatus('Script kam se kam 10 characters likho।', true); return; }
  btn.disabled = true;
  setStatus('<span class="spinner"></span>Video ban raha hai… (1–3 min)');
  try {
    const r = await fetch('/api/jobs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, lang, title})
    });
    const j = await r.json();
    if (!j.ok) { setStatus('Error: ' + (j.error || 'try again'), true); btn.disabled = false; return; }
    poll(j.job_id);
  } catch (e) {
    setStatus('Network error — dobara try karo।', true); btn.disabled = false;
  }
}
async function poll(id) {
  const btn = document.getElementById('makeBtn');
  timer = setInterval(async () => {
    try {
      const r = await fetch('/api/jobs/' + id);
      const j = await r.json();
      if (j.status === 'done') {
        clearInterval(timer);
        setStatus('✅ Video taiyaar hai!');
        const a = document.getElementById('dlLink');
        a.href = j.download_url;
        document.getElementById('dl').style.display = 'block';
        btn.disabled = false;
      } else if (j.status === 'error') {
        clearInterval(timer);
        setStatus('❌ ' + (j.error || 'ban nahi paya'), true);
        btn.disabled = false;
      } else {
        setStatus('<span class="spinner"></span>' +
          (j.status === 'working' ? 'Render ho raha hai…' : 'Line me hai…'));
      }
    } catch (e) { /* keep polling */ }
  }, 3000);
}
</script>
</body>
</html>
