# PVideo nginx reverse proxy — installed by deploy/install.sh
# Port 80 serves only the Let's Encrypt ACME challenge; certbot upgrades
# this vhost to HTTPS and adds the HTTP->HTTPS redirect.
server {
    listen 80 default_server;
    server_name PVIDEO_DOMAIN_PLACEHOLDER;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # renders can take many minutes; keep the connection open
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
    }
}
